
name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/**/requirements.txt'

      - name: Upgrade Pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          services=("auth-service" "analytics-service" "cart-service" "catalog-service" "gateway" "order-service" "payment-service" "quiz-service")

          for service in "${services[@]}"
          do
            echo "Installing dependencies for $service"
            python -m pip install -r backend/$service/requirements.txt
          done
      - name: Validate Python Syntax
        run: |
          services=("auth-service" "analytics-service" "cart-service" "catalog-service" "gateway" "order-service" "payment-service" "quiz-service")

          for service in "${services[@]}"
          do
            echo "Checking syntax for $service"
            python -m compileall -q "backend/$service"
          done

      - name: Run Backend Service Tests
        run: |
          services=("auth-service" "analytics-service" "cart-service" "catalog-service" "gateway" "order-service" "payment-service" "quiz-service")

          for service in "${services[@]}"
          do
            echo "Running tests for $service"
            (cd "backend/$service" && python -m pytest -v) || exit 1
          done
